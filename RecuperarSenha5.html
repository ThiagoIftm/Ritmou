<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RITMOU - Recuperar Senha</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* RESET DE ESTILOS BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      background-color: #243b8b;
    }

    .container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* ==================== PAINEL ESQUERDO (LOGO DA MARCA) ==================== */
    .left-panel {
      flex: 1;
      background-color: #f4f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .main-logo-img {
      width: 85%;
      max-width: 750px;
      max-height: 80vh;
      height: auto;
      object-fit: contain;
      display: block;
      margin: auto;
    }

    /* ==================== PAINEL DIREITO (FORMULÁRIO DE RECUPERAÇÃO) ==================== */
    .right-panel {
      flex: 1.3;
      background-color: #243b8b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      color: #ffffff;
    }

    /* CABEÇALHO DO FORMULÁRIO */
    .form-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      text-align: center;
    }

    .mini-logo-circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background-color: #326fdb;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.35);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .mini-logo-img {
      width: 135px;
      height: 135px;
      object-fit: contain;
    }

    .welcome-title {
      font-size: 32px;
      font-weight: 700;
    }

    .welcome-subtitle {
      font-size: 16px;
      font-weight: 600;
      color: #d1d5db;
      margin-top: 4px;
    }

    /* ESTRUTURA DO FORMULÁRIO DE RECUPERAÇÃO */
    .recovery-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
      width: 100%;
      max-width: 480px;
    }

    .instruction-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
      text-align: center;
      color: #ffffff;
      max-width: 430px;
    }

    .form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .form-input {
      width: 100%;
      height: 62px;
      background-color: #4a8bf5;
      border: none;
      border-radius: 31px;
      padding: 0 28px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      outline: none;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.2s ease;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .form-input:focus {
      background-color: #3b7be3;
    }

    /* BOTÃO ENVIAR */
    .submit-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .btn-submit {
      background-color: #4a8bf5;
      color: #ffffff;
      font-weight: 700;
      font-size: 18px;
      padding: 14px 58px;
      border-radius: 28px;
      border: none;
      cursor: pointer;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.2s ease, transform 0.1s ease, opacity 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #3b7be3;
      transform: scale(1.02);
    }

    .btn-submit:disabled {
      opacity: 0.75;
      cursor: wait;
      transform: none;
    }

    /* RODAPÉ DO FORMULÁRIO */
    .footer-text {
      margin-top: 25px;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .register-link {
      color: #10b981;
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }

    .register-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- PAINEL ESQUERDO DA LOGO DA MARCA -->
    <main class="left-panel">
      <img src="Imagens/LogoRitmou.png" alt="Logo RITMOU" class="main-logo-img">
    </main>

    <!-- PAINEL DIREITO DO FORMULÁRIO DE RECUPERAÇÃO -->
    <aside class="right-panel">
      
      <div class="form-header">
        <div class="mini-logo-circle">
          <img src="Imagens/LogoRitmou.png" alt="Mini Logo" class="mini-logo-img">
        </div>
        <h2 class="welcome-title">Bem Vindo!</h2>
        <p class="welcome-subtitle">Recupere Sua Senha</p>
      </div>

      <form id="recoveryForm" class="recovery-form">
        
        <p class="instruction-text">
          Para recuperar sua senha, digite seu endereço email para enviarmos um link para a alteração da senha.
        </p>

        <!-- CAMPO DE EMAIL -->
        <div class="form-group">
          <input type="email" id="emailInput" class="form-input" placeholder="Digite seu email aqui" required>
        </div>

        <!-- BOTÃO DE ENVIAR E LINK DE REGISTRO -->
        <div class="submit-container">
          <button type="submit" id="submitBtn" class="btn-submit">Enviar</button>
          <p class="footer-text">Novo Por Aqui? <a href="Cadastrar2.html" class="register-link">Registre - se</a></p>
        </div>

      </form>

    </aside>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const recoveryForm = document.getElementById('recoveryForm');
      const submitBtn = document.getElementById('submitBtn');

      recoveryForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('emailInput').value.trim();

        if (email) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Enviando...';

          setTimeout(() => {
            alert('Um link de recuperação foi enviado para o email: ' + email);
            submitBtn.disabled = false;
            submitBtn.textContent = 'Enviar';
            window.location.href = 'Entrar3.html';
          }, 1500);
        }
      });
    });
  </script>

</body>
</html>
