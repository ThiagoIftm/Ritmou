<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RITMOU - Painel Artista</title>
  <link rel="stylesheet" href="style.css">
  
  <style>


/* ==================== CONTEÚDO PRINCIPAL (SEM ROLAGEM) ==================== */
    .main-content {
      position: fixed;
      top: 180px; /* Alinhado perfeitamente com os menus laterais */
      bottom: 0;
      left: 220px; /* Escala de 75% sobre os 270px originais */
      right: 270px; /* Escala de 75% sobre os 330px originais */
      overflow: hidden; /* SEM ROLAGEM */
      padding: 8px 8px 0 8px; 
      display: flex;
      flex-direction: column;
    }

    /* BANNER SUPERIOR DO ARTISTA */
    .artist-hero {
      position: relative;
      z-index: 2;
      height: 250px;
      border-radius: 24px 24px 0 0;
      background-image: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.1) 60%);
      background-size: cover;
      background-position: center 25%;
      display: flex;
      align-items: flex-end;
      padding: 11px 19px;
      color: #ffffff;
      flex-shrink: 0;
      width: 100%;
    }

    .artist-hero-name {
      font-size: 29px;
      font-weight: 800;
      line-height: 1.1;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
    }

    /* CONTAINER AZUL QUE PREENCHE ATÉ O FINAL DA TELA */
    .artist-details-container {
      position: relative;
      z-index: 1;
      background-color: #223555;
      border-radius: 0; 
      padding: 15px 19px 30px 19px;
      box-shadow: 3px 5px 11px rgba(0, 0, 0, 0.3);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      flex: 1; 
      width: 100%;
      overflow: hidden;
    }

    /* CABEÇALHO DA TABELA */
    .tracklist-header {
      display: flex;
      align-items: center;
      padding: 0 8px 6px 8px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .col-num {
      width: 26px;
    }

    .col-img-space {
      width: 29px;
      margin-right: 9px;
    }

    .col-title {
      flex: 1;
    }

    .col-time {
      width: 60px;
      text-align: right;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .col-plays {
      width: 98px;
      text-align: right;
    }

    .clock-icon {
      width: 15px;
      height: 15px;
      fill: #ffffff;
    }

    /* CORPO DA LISTA DE POPULARES */
    .tracklist-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-row {
      display: flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 6px;
      text-decoration: none;
      color: #ffffff;
      transition: background-color 0.2s ease;
    }

    .track-row:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .track-num {
      width: 26px;
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
    }

    .track-img-icon {
      width: 38px;
      height: 38px;
      border-radius: 5px;
      object-fit: cover;
      margin-right: 9px;
      flex-shrink: 0;
      box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .track-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .track-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
    }

    .track-artist {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
    }

    .track-duration {
      width: 60px;
      text-align: right;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }

    .track-plays {
      width: 98px;
      text-align: right;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
    }

    /* ==================== SESSÃO ÁLBUNS ==================== */
    .albums-section {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .albums-badge {
      align-self: flex-start;
      background-color: #3b5998;
      color: #ffffff;
      padding: 5px 15px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.3);
    }

    .albums-grid {
      display: flex;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      gap: 100px;
      padding: 4px 0;
    }

    .album-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.2s ease;
    }

    .album-card:hover {
      transform: translateY(-3px);
    }

    .album-cover-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 5px 11px rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .album-name {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="header">
    <div class="header-left">
      <div class="logo-circle-wrapper">
        <img src="Imagens/LogoRitmou.png" alt="Logo RITMOU" class="logo-img">
      </div>
    </div>

    <div class="header-center">
      <div class="search-row">
        <a href="Inicio.html" class="home-btn" title="Início">
          <svg class="home-icon" viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </a>

        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" class="search-input" placeholder="O que deseja ouvir?">
        </div>
      </div>

      <div class="nav-buttons">
        <a href="Musicas.html">
          <button class="nav-btn">MÚSICAS</button>
        </a>
        <a href="BibliotecaUs6.html">
          <button class="nav-btn">PLAYLISTS</button>
        </a>        
      </div>
    </div>

    <div class="header-right">
      <a href="UsuárioInfo13.html" class="profile-link" title="Perfil do Usuário">
        <img src="Imagens/user_icon.png" alt="Foto Perfil" class="profile-img">
      </a>
    </div>
  </header>

  <!-- MENU LATERAL ESQUERDO -->
  <aside class="sidebar-left" id="sidebarLeft">
    <button class="sidebar-toggle-btn" onclick="toggleSidebarLeft()"> 
      <span class="sidebar-title-text">Sua Biblioteca</span>
    </button>

    <div class="playlist-list">
      <a href="UsuárioPl9.html" class="playlist-item">
        <img src="Imagens/artistas/35.png" alt="Playlist 1" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 1</span>
      </a>
      <a href="UsuárioPl9.html" class="playlist-item">
        <img src="Imagens/artistas/38.png" alt="Playlist 2" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 2</span>
      </a>
      <a href="UsuárioPl9.html" class="playlist-item">
        <img src="Imagens/artistas/37.png" alt="Playlist 3" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 3</span>
      </a>
      <a href="UsuárioPl9.html" class="playlist-item">
        <img src="Imagens/artistas/36.png" alt="Playlist 4" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 4</span>
      </a>
      <a href="UsuárioPl9.html" class="playlist-item">
        <img src="Imagens/artistas/29.png" alt="Playlist 5" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 5</span>
      </a>
      <a href="UsuárioPl9.html" class="playlist-item">
        <img src="Imagens/artistas/39.png" alt="Playlist 6" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 6</span>
      </a>
    </div>
  </aside>






  
  <!-- ÁREA CENTRAL DA PÁGINA (TELA DO ARTISTA - SEM SCROLL) -->
  <main class="main-content" id="mainContent">


    <!-- CAIXA COM IMAGEM DE FUNDO DO ARTISTA -->
    <section id="artist-hero-section" class="artist-hero">
      <h1 id="nome-artista-texto" class="artist-hero-name">Carregando...</h1>
    </section>

    <!-- CONTAINER DE MÚSICAS POPULARES DO ARTISTA E ÁLBUNS -->
    <section class="artist-details-container">
      
      <div class="tracklist-header">
        <span class="col-num">#</span>
        <span class="col-img-space"></span>
        <span class="col-title">Populares</span>
        <span class="col-time">
          <svg class="clock-icon" viewBox="0 0 24 24">
            <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
          </svg>
        </span>
        <span class="col-plays">Reproduções</span>
      </div>




      <!-- AS 5 MÚSICAS MAIS TOCADAS -->
      
      <div id="populares-container" class="tracklist-body">
      <!-- AS 5 MÚSICAS MAIS TOCADAS SERÃO GERADAS AQUI PELO JS -->
      </div>




      <!-- SESSÃO DE ÁLBUNS -->
      <div class="albums-section">
        <div class="albums-badge">Álbuns</div>

        <!-- CONTAINER ONDE OS ÁLBUNS SERÃO GERADOS PELO JS -->
        <div id="albums-container" class="albums-grid">
            
        </div>
      </div>

    </section>

  </main>

    <!-- ÁREA DE MÚSICA DIREITA (Inicia Expandido) -->
    <aside class="sidebar-right expanded" id="sidebarRight" onclick="handleRightSidebarClick(event)">
      <div class="music-collapsed-view">
        <div class="music-collapsed-btn">&lt;</div>
      </div>

      
      <div class="sidebar-right-header"> 
        <h2 class="sidebar-right-title">Discoteca</h2>
      </div>

      <!-- Capa da Música -->
      <div class="music-cover-container">
        <a href="#" id="menu-link-capa">
          <img src="" alt="Capa da Música" class="music-cover" id="menu-img-capa">
        </a>
      </div>

      <div class="minimal-player-container">
        <!-- Barra de Progresso -->
        <div class="player-progress">
          <input type="range" id="minimal-progress" min="0" max="100" value="0">
        </div>

        <!-- Controlos de Reprodução -->
        <div class="player-controls-bottom">
          <button class="control-btn prev-btn">
            <svg viewBox="0 0 24 24" class="icon-skip"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="control-btn play-pause-btn">
            <svg viewBox="0 0 24 24" class="icon-pause"><path d="M8 19h3V5H8v14zm5-14v14h3V5h-3z"/></svg>
          </button>
          <button class="control-btn next-btn">
            <svg viewBox="0 0 24 24" class="icon-skip"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
      </div>

      <!-- Informações da Música -->
      <div class="music-info-row">
        <div class="music-text">
          <!-- Adicionada a tag <a> em volta do nome da música -->
          <a href="#" id="menu-link-musica" style="text-decoration: none; color: inherit;">
            <h3 class="music-name" id="menu-nome-musica">Carregando...</h3>
          </a>
          <a href="#" id="menu-link-artista-sub">
            <p class="artist-name-sub" id="menu-nome-artista-sub">Carregando...</p>
          </a>
        </div>
      </div>

      <!-- Sobre o Artista -->
      <div class="artist-card-box">
        <h4 class="artist-card-title">Sobre o Artista</h4>
        <div class="artist-avatar-mini">
          <a href="#" id="menu-link-artista-mini">
            <img src="" alt="Artista Mini" style="width:100%;height:100%;object-fit:cover;" id="menu-img-artista">
          </a>
        </div>
        <a href="#" id="menu-link-artista-card">
          <h5 class="artist-card-name" id="menu-nome-artista-card">Carregando...</h5>
        </a>
        <p class="artist-card-bio" id="menu-bio-artista">
          <!-- Deixei dinâmico caso queira adicionar a bio no futuro, ou pode manter texto estático -->
          Acompanhe os sucessos e a trajetória deste artista.
        </p>
      </div>

      </div>
    </aside>

  <script>

      document.addEventListener('DOMContentLoaded', () => {
      const sidebarLeft = document.getElementById('sidebarLeft');
      const sidebarRight = document.getElementById('sidebarRight');
      const toggleIconLeft = document.getElementById('toggleIconLeft');

      // Adiciona a classe 'expanded' para iniciar expandido
      sidebarLeft.classList.add('expanded');
      sidebarRight.classList.add('expanded');

      // Muda o ícone para indicar que o menu está aberto
      if (toggleIconLeft) {
        toggleIconLeft.textContent = '<';
      }
  });


      // CONTROLE DO MENU LATERAL ESQUERDO
      function toggleSidebarLeft() {
        const sidebarLeft = document.getElementById('sidebarLeft');
        const toggleIcon = document.getElementById('toggleIconLeft');

        sidebarLeft.classList.toggle('expanded');

        if (sidebarLeft.classList.contains('expanded')) {
          toggleIcon.textContent = '<';
        } else {
          toggleIcon.textContent = '>';
        }
      }

      // CONTROLE DO MENU LATERAL DIREITO
      function handleRightSidebarClick(event) {
        const sidebarRight = document.getElementById('sidebarRight');

        if (!sidebarRight.classList.contains('expanded')) {
          sidebarRight.classList.add('expanded');
        }
      }

      function collapseSidebarRight(event) {
        event.stopPropagation();
        const sidebarRight = document.getElementById('sidebarRight');

        sidebarRight.classList.remove('expanded');
      }

      // FUNÇÃO PARA MOSTRAR/OCULTAR A LETRA COMPLETA
      function toggleLyrics() {
        const extraLyrics = document.getElementById('extraLyrics');
        const showMoreBtn = document.getElementById('showMoreBtn');

        if (extraLyrics.style.display === 'inline' || extraLyrics.style.display === 'block') {
          extraLyrics.style.display = 'none';
          showMoreBtn.textContent = '...Mostrar Mais';
        } else {
          extraLyrics.style.display = 'inline';
          showMoreBtn.textContent = '...Mostrar Menos';
        }
      }
  </script>


  <script src="ScriptArtista.js"></script>
  <script src="ScriptMusicaGlobal.js"></script>


</body>
</html>
