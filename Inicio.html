<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RITMOU - Início</title>
  <link rel="stylesheet" href="style.css">
  
  <style>


/* ==================== CONTEÚDO PRINCIPAL ==================== */
.main-content {
  position: fixed;
  top: 259px;
  bottom: 0;
  left: 155px; /* Mantém o centro fixado na posição exata da imagem */
  right: 263px; /* Mantém o centro fixado na posição exata da imagem */
  overflow-y: auto;
  padding-top: 8px;
  padding-left: 113px;
  padding-right: 15px;
  padding-bottom: 45px;
  display: flex;
  flex-direction: column;
  gap: 60px;

  /* Oculta a barra de rolagem no Firefox e navegadores modernos */
  scrollbar-width: none;
  -ms-overflow-style: none; /* Oculta no IE/Edge antigo */
}

/* Oculta a barra de rolagem no Chrome, Safari, Edge e Opera */
.main-content::-webkit-scrollbar {
  display: none;
}

.section-container {
  width: 100%;
}

.section-title-box {
  background-color: #243b8b;
  color: #ffffff;
  font-size: 20px;
  font-weight: 700;
  padding: 9px 24px;
  border-radius: 12px;
  display: inline-block;
  margin: 0 0 26px 0;
  box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.25);
  user-select: none;
}

.cards-row {
  display: flex;
  justify-content: flex-start;
  gap: 150px;
  align-items: flex-start;
  width: 100%;
}

.card-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
}

.circle-avatar {
  width: 203px;
  height: 203px;
  border-radius: 50%;
  overflow: hidden;
  background-color: #cbd5e1;
  box-shadow: 3px 5px 11px rgba(0, 0, 0, 0.3);
  transition: transform 0.2s ease;
  cursor: pointer;
}

.circle-avatar:hover {
  transform: scale(1.04);
}

.circle-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.genre-label-box {
  width: 203px;
  background-color: #243b8b;
  color: #ffffff;
  font-weight: 700;
  font-size: 15px;
  text-align: center;
  padding: 6px 0;
  border-radius: 11px;
  margin-top: 14px;
  box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.25);
  user-select: none;
}


</style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="header">
    <div class="header-left">
      <div class="logo-circle-wrapper">
        <img src="Imagens/LogoRitmou.png" alt="Logo RITMOU" class="logo-img">
      </div>
    </div>

    <div class="header-center">
      <div class="search-row">
        <a href="UsuárioLogado4.html" class="home-btn" title="Início">
          <svg class="home-icon" viewBox="0 0 24 24">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </a>

        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" class="search-input" placeholder="O que deseja ouvir?">
        </div>
      </div>

      <div class="nav-buttons">
        <a href="Musicas.html">
          <button class="nav-btn">MÚSICAS</button>
        </a>
        <a href="BibliotecaUs6.html">
          <button class="nav-btn">PLAYLISTS</button>
        </a>        
      </div>
    </div>

    <div class="header-right">
      <a href="UsuárioInfo13.html" class="profile-link" title="Perfil do Usuário">
        <img src="Imagens/user_icon.png" alt="Foto Perfil" class="profile-img">
      </a>
    </div>
  </header>

  <!-- MENU LATERAL ESQUERDO (Inicia Expandido) -->
  <aside class="sidebar-left expanded" id="sidebarLeft">
    <button class="sidebar-toggle-btn" onclick="toggleSidebarLeft()"> 
      <span class="sidebar-title-text">Sua Biblioteca</span>
    </button>

    <div class="playlist-list">
      <a href="Playlist.html?id=pl0" class="playlist-item">
        <img src="Imagens/artistas/35.png" alt="Playlist 1" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 1</span>
      </a>
      <a href="Playlist.html?id=pl0" class="playlist-item">
        <img src="Imagens/artistas/38.png" alt="Playlist 2" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 2</span>
      </a>
      <a href="Playlist.html?id=pl0" class="playlist-item">
        <img src="Imagens/artistas/37.png" alt="Playlist 3" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 3</span>
      </a>
      <a href="Playlist.html?id=pl0" class="playlist-item">
        <img src="Imagens/artistas/36.png" alt="Playlist 4" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 4</span>
      </a>
      <a href="Playlist.html?id=pl0" class="playlist-item">
        <img src="Imagens/artistas/29.png" alt="Playlist 5" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 5</span>
      </a>
      <a href="Playlist.html?id=pl0" class="playlist-item">
        <img src="Imagens/artistas/39.png" alt="Playlist 6" class="playlist-thumb">
        <span class="playlist-name">Nome Playlist 6</span>
      </a>
    </div>
  </aside>

  <!-- ÁREA CENTRAL DA PÁGINA (Completamente Fixa) -->
  <main class="main-content" id="mainContent">

    <section class="section-container">
      <div class="section-title-box">Top Artistas Populares</div>

      <div class="cards-row">
        <a href="PainelArtista.html?id=ar15" class="card-item">
          <div class="circle-avatar">
            <img src="Imagens/artistas/45.png" alt="Ferrugem" class="circle-img">
          </div>
        </a>

        <a href="PainelArtista.html?id=ar8" class="card-item">
          <div class="circle-avatar">
            <img src="Imagens/artistas/33.png" alt="Diego & Victor Hugo" class="circle-img">
          </div>
        </a>

        <a href="PainelArtista.html?id=ar0" class="card-item">
          <div class="circle-avatar">
            <img src="Imagens/artistas/32.png" alt="Grupo Menos é Mais" class="circle-img">
          </div>
        </a>

        <a href="PainelArtista.html?id=ar9" class="card-item">
          <div class="circle-avatar">
            <img src="Imagens/artistas/55.png" alt="Mc Negão Original" class="circle-img">
          </div>
        </a>
      </div>
    </section>

    <section class="section-container">
      <div class="section-title-box">Gêneros Musicais</div>

      <div class="cards-row">
        <div class="card-item">
          <a href="PainelGenero.html?id=g0" class="circle-avatar">
            <img src="Imagens/generos/pagode.png" alt="Pagode" class="circle-img">
          </a>
          <div class="genre-label-box">Pagode</div>
        </div>

        <div class="card-item">
          <a href="PainelGenero.html?id=g1" class="circle-avatar">
            <img src="Imagens/generos/sertanejo.png" alt="Sertanejo" class="circle-img">
          </a>
          <div class="genre-label-box">Sertanejo</div>
        </div>

        <div class="card-item">
          <a href="PainelGenero.html?id=g4" class="circle-avatar">
            <img src="Imagens/generos/funk.png" alt="Funk" class="circle-img">
          </a>
          <div class="genre-label-box">Funk</div>
        </div>

        <div class="card-item">
          <a href="PainelGenero.html?id=g3" class="circle-avatar">
            <img src="Imagens/generos/mpb.png" alt="MPB" class="circle-img">
          </a>
          <div class="genre-label-box">MPB</div>
        </div>
      </div>
    </section>

  </main>

    <!-- ÁREA DE MÚSICA DIREITA (Inicia Expandido) -->
    <aside class="sidebar-right expanded" id="sidebarRight">
      <div class="music-collapsed-view">
        <div class="music-collapsed-btn">&lt;</div>
      </div>

      
      <div class="sidebar-right-header">
        <h2 class="sidebar-right-title">Discoteca</h2>
      </div>

      <!-- Capa da Música -->
      <div class="music-cover-container">
        <a href="#" id="menu-link-capa">
          <img src="" alt="Capa da Música" class="music-cover" id="menu-img-capa">
        </a>
      </div>

      <div class="minimal-player-container">
        <!-- Barra de Progresso -->
        <div class="player-progress">
          <input type="range" id="minimal-progress" min="0" max="100" value="0">
        </div>

        <!-- Controlos de Reprodução -->
        <div class="player-controls-bottom">
          <button class="control-btn prev-btn">
            <svg viewBox="0 0 24 24" class="icon-skip"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="control-btn play-pause-btn">
            <svg viewBox="0 0 24 24" class="icon-pause"><path d="M8 19h3V5H8v14zm5-14v14h3V5h-3z"/></svg>
          </button>
          <button class="control-btn next-btn">
            <svg viewBox="0 0 24 24" class="icon-skip"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
      </div>

      <!-- Informações da Música -->
      <div class="music-info-row">
        <div class="music-text">
          <!-- Adicionada a tag <a> em volta do nome da música -->
          <a href="#" id="menu-link-musica" style="text-decoration: none; color: inherit;">
            <h3 class="music-name" id="menu-nome-musica">Carregando...</h3>
          </a>
          <a href="#" id="menu-link-artista-sub">
            <p class="artist-name-sub" id="menu-nome-artista-sub">Carregando...</p>
          </a>
        </div>
      </div>

      <!-- Sobre o Artista -->
      <div class="artist-card-box">
        <h4 class="artist-card-title">Sobre o Artista</h4>
        <div class="artist-avatar-mini">
          <a href="#" id="menu-link-artista-mini">
            <img src="" alt="Artista Mini" style="width:100%;height:100%;object-fit:cover;" id="menu-img-artista">
          </a>
        </div>
        <a href="#" id="menu-link-artista-card">
          <h5 class="artist-card-name" id="menu-nome-artista-card">Carregando...</h5>
        </a>
        <p class="artist-card-bio" id="menu-bio-artista">
          <!-- Deixei dinâmico caso queira adicionar a bio no futuro, ou pode manter texto estático -->
          Acompanhe os sucessos e a trajetória deste artista.
        </p>
      </div>

      </div>
    </aside>


  <script src="ScriptMusicaGlobal.js"></script>

</body>
</html>
