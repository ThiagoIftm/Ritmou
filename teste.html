<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista FWD2</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            padding: 20px;
        }

        .container {
            width: 420px;
        }

        .form-card {
            border: 1px solid #7f9db9;
            padding: 12px;
            background-color: #f9f9f9;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
            margin-bottom: 15px;
        }

        .field {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .field label {
            width: 80px;
            font-size: 14px;
            color: #000;
        }

        .field input {
            flex: 1;
            border: 1px solid #7f9db9;
            padding: 2px 4px;
            font-size: 13px;
            outline: none;
        }

        .button-container {
            margin-left: 80px;
            margin-top: 8px;
        }

        button {
            padding: 2px 14px;
            border: 1px solid #7f9db9;
            background-color: #e1e1e1;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background-color: #d0d0d0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            border: 1px solid #7f9db9;
        }

        th {
            background-color: #fff9e6;
            border: 1px solid #7f9db9;
            padding: 4px;
            text-align: left;
            font-weight: bold;
        }

        td {
            border: 1px solid #7f9db9;
            padding: 4px;
        }

        .col-actions {
            width: 45px;
            text-align: center;
            white-space: nowrap;
        }

        .icon-btn {
            cursor: pointer;
            margin: 0 2px;
            font-size: 12px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-card">
            <form id="formContato">
                <input type="hidden" id="editIndex" value="">
                
                <div class="field">
                    <label for="codigo">Código:</label>
                    <input type="text" id="codigo" required>
                </div>
                <div class="field">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="field">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" required>
                </div>
                <div class="field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="field button-container">
                    <button type="submit" id="btnSalvar">Salvar</button>
                </div>
            </form>
        </div>


        <div class="table-card">
            <table id="tabelaContatos">
                <thead>
                    <tr>
                        <th class="col-actions"></th>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                </tbody>
            </table>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let contatos = [];

            const formContato = document.getElementById('formContato');
            const corpoTabela = document.getElementById('corpoTabela');
            const editIndexInput = document.getElementById('editIndex');

            async function inicializarBanco() {
                const dadosSalvos = localStorage.getItem('db_contatos');

                if (dadosSalvos) {
                    // Carrega dados existentes do LocalStorage (JSON)
                    contatos = JSON.parse(dadosSalvos);
                    renderizarTabela();
                } else {

                    try {
                        const response = await fetch('dados.xml');
                        const xmlText = await response.text();
                        
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                        const nosContatos = xmlDoc.querySelectorAll('contato');

                        nosContatos.forEach(no => {
                            contatos.push({
                                codigo: no.querySelector('codigo').textContent,
                                nome: no.querySelector('nome').textContent,
                                telefone: no.querySelector('telefone').textContent,
                                email: no.querySelector('email').textContent
                            });
                        });

                        salvarNoLocalStorage();
                        renderizarTabela();
                    } catch (error) {
                        console.error('Erro ao ler arquivo XML:', error);
                    }
                }
            }


            function salvarNoLocalStorage() {
                localStorage.setItem('db_contatos', JSON.stringify(contatos));
            }


            function renderizarTabela() {
                corpoTabela.innerHTML = '';

                contatos.forEach((item, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="col-actions">
                            <span class="icon-btn" onclick="editarContato(${index})">✏️</span>
                            <span class="icon-btn" onclick="excluirContato(${index})">❌</span>
                        </td>
                        <td>${item.codigo}</td>
                        <td>${item.nome}</td>
                        <td>${item.telefone}</td>
                        <td>${item.email}</td>
                    `;
                    corpoTabela.appendChild(tr);
                });
            }


            formContato.addEventListener('submit', (e) => {
                e.preventDefault();

                const codigo = document.getElementById('codigo').value.trim();
                const nome = document.getElementById('nome').value.trim();
                const telefone = document.getElementById('telefone').value.trim();
                const email = document.getElementById('email').value.trim();
                const index = editIndexInput.value;

                if (index !== '') {
                    // Edição
                    contatos[index] = { codigo, nome, telefone, email };
                    editIndexInput.value = '';
                } else {
                    // Novo cadastro
                    contatos.push({ codigo, nome, telefone, email });
                }

                salvarNoLocalStorage();
                renderizarTabela();
                formContato.reset();
            });


            window.editarContato = function(index) {
                const item = contatos[index];
                document.getElementById('codigo').value = item.codigo;
                document.getElementById('nome').value = item.nome;
                document.getElementById('telefone').value = item.telefone;
                document.getElementById('email').value = item.email;
                editIndexInput.value = index;
            };


            window.excluirContato = function(index) {
                contatos.splice(index, 1);
                salvarNoLocalStorage();
                renderizarTabela();
            };


            inicializarBanco();
        });
    </script>
</body>
</html>
