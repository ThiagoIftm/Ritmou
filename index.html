<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RITMOU - Início</title>
  <style>
    /* ==================== RESET DE ESTILOS BASE ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #e2e8f0;
      min-height: 100vh;
    }

    /* ==================== CABEÇALHO ==================== */
    .header {
      width: 100%;
      height: 225px;
      background-color: #243b8b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3rem;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      box-shadow: 15px 15px 22.5px rgba(0, 0, 0, 0.4);
    }

    .header-left {
      display: flex;
      align-items: center;
      min-width: 225px;
      transform: translateY(-45px);
    }

    

    .logo-img {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      object-fit: cover;
    }

    .header-center {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -45px);
      display: flex;
      align-items: center;
    }

    .home-btn {
      width: 72px;
      height: 72px;
      background-color: #4a8bf5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 45px;
      text-decoration: none;
      transition: background-color 0.2s ease;
      box-shadow: 15px 15px 22.5px rgba(0, 0, 0, 0.4);
    }

    .home-btn:hover {
      background-color: #3b7be3;
    }

    .home-icon {
      width: 39px;
      height: 39px;
      fill: #ffffff;
    }

    .search-box {
      display: flex;
      align-items: center;
      width: 510px;
      height: 72px;
      background-color: #4a8bf5;
      border-radius: 36px;
      padding: 0 27px;
      box-shadow: 15px 15px 22.5px rgba(0, 0, 0, 0.4);
    }

    .search-icon {
      width: 33px;
      height: 33px;
      fill: #ffffff;
      margin-right: 18px;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #ffffff;
      font-size: 22.5px;
      font-weight: 600;
    }

    .search-input::placeholder {
      color: #ffffff;
      font-weight: 600;
      opacity: 0.9;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 22.5px;
      min-width: 225px;
      justify-content: flex-end;
      transform: translateY(-45px);
    }

    .btn-auth {
      background-color: #4a8bf5;
      color: #ffffff;
      font-weight: 700;
      font-size: 21px;
      letter-spacing: 0.75px;
      padding: 18px 36px;
      border-radius: 27px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      text-transform: uppercase;
      transition: background-color 0.2s ease;
    }

    .btn-auth:hover {
      background-color: #3b7be3;
    }

    /* ==================== BARRA LATERAL ==================== */
    .sidebar {
      position: fixed;
      top: 345px;
      left: 0;
      bottom: 0;
      width: 420px;
      background-color: #243b8b;
      border-radius: 0 30px 0 0;
      padding: 36px 27px;
      display: flex;
      flex-direction: column;
      gap: 36px;
      box-shadow: 7.5px 0 22.5px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
    }

    .sidebar-title {
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
    }

    /* BOTÃO "+ CRIAR" */
    .btn-criar {
      display: flex;
      align-items: center;
      gap: 9px;
      background-color: #4a8bf5;
      color: #ffffff;
      font-weight: 700;
      font-size: 21px;
      padding: 9px 18px;
      border-radius: 27px;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 7.5px 7.5px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-criar:hover {
      background-color: #3b7be3;
      transform: scale(1.02);
    }

    .plus-icon {
      width: 27px;
      height: 27px;
      fill: #ffffff;
    }

    .card-playlist {
      background-color: #4a8bf5;
      border-radius: 30px;
      padding: 36px 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 7.5px 7.5px 15px rgba(0, 0, 0, 0.2);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .card-playlist:hover {
      background-color: #3b7be3;
      transform: translateY(-3px);
    }

    .card-title {
      color: #ffffff;
      font-size: 28.5px;
      font-weight: 700;
      line-height: 1.25;
    }

    .card-subtitle {
      color: #d1d5db;
      font-size: 22.5px;
      font-weight: 600;
    }

    /* ==================== CONTEÚDO PRINCIPAL ==================== */
    .main-content {
      margin-top: 345px;
      margin-left: 540px;
      padding-right: 75px;
      padding-bottom: 90px;
      display: flex;
      flex-direction: column;
      gap: 75px;
    }

    .section-title-box {
      background-color: #243b8b;
      color: #ffffff;
      font-size: 27px;
      font-weight: 700;
      padding: 12px 36px;
      border-radius: 18px;
      display: inline-block;
      width: fit-content;
      box-shadow: 6px 6px 15px rgba(0, 0, 0, 0.3);
      margin-bottom: 37.5px;
      user-select: none;
    }

    .cards-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: flex-start;
    }

    .card-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 315px;
    }

    .circle-link {
      width: 315px;
      height: 315px;
      border-radius: 50%;
      overflow: hidden;
      display: block;
      box-shadow: 9px 9px 22.5px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .circle-link:hover {
      transform: scale(1.05);
      box-shadow: 12px 12px 30px rgba(0, 0, 0, 0.45);
    }

    .circle-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .genre-label-box {
      width: 100%;
      background-color: #243b8b;
      color: #ffffff;
      font-weight: 700;
      font-size: 24px;
      text-align: center;
      padding: 12px 0;
      border-radius: 18px;
      margin-top: 72px;
      box-shadow: 6px 6px 15px rgba(0, 0, 0, 0.3);
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO DA PÁGINA -->
  <header class="header">
    <div class="header-left">
      <img src="Imagens/LogoRitmouFundo.png" alt="Logo RITMOU" class="logo-img">
    </div>

    <div class="header-center">
      <a href="index.html" class="home-btn" title="Início">
        <svg class="home-icon" viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </a>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" class="search-input" placeholder="O que deseja ouvir?">
      </div>
    </div>

    <div class="header-right">
      <a href="Cadastrar2.html" class="btn-auth">INSCREVER</a>
      <a href="Entrar3.html" class="btn-auth">ENTRAR</a>
    </div>
  </header>

  <!-- BARRA LATERAL (MENU) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Sua Biblioteca</h2>
      
      <a href="Entrar3.html" class="btn-criar">
        <svg class="plus-icon" viewBox="0 0 24 24">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        Criar
      </a>
    </div>

    <a href="Entrar3.html" class="card-playlist">
      <span class="card-title">Crie sua primeira playlist</span>
      <span class="card-subtitle">Criar playlist</span>
    </a>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main-content">

    <!-- SESSÃO 1: TOP ARTISTAS POPULARES -->
    <section>
      <div class="section-title-box">Top Artistas Populares</div>

      <div class="cards-row">
        <div class="card-item">
          <a href="TelaArtista12.html" class="circle-link">
            <img src="Imagens/artistas/34.png" alt="Henrique e Juliano" class="circle-img">
          </a>
        </div>

        <div class="card-item">
          <a href="TelaArtista12.html" class="circle-link">
            <img src="Imagens/artistas/33.png" alt="Diego e Victor Hugo" class="circle-img">
          </a>
        </div>

        <div class="card-item">
          <a href="TelaArtista12.html" class="circle-link">
            <img src="Imagens/artistas/32.png" alt="Pau do Pecado" class="circle-img">
          </a>
        </div>

        <div class="card-item">
          <a href="TelaArtista12.html" class="circle-link">
            <img src="Imagens/artistas/31.png" alt="Jorge e Mateus" class="circle-img">
          </a>
        </div>
      </div>
    </section>

    <!-- SESSÃO 2: GÊNEROS MUSICAIS -->
    <section>
      <div class="section-title-box">Gêneros Musicais</div>

      <div class="cards-row">
        <div class="card-item">
          <a href="Genero14.html" class="circle-link">
            <img src="Imagens/generos/pagode.png" alt="Pagode" class="circle-img">
          </a>
          <div class="genre-label-box">Pagode</div>
        </div>

        <div class="card-item">
          <a href="Genero14.html" class="circle-link">
            <img src="Imagens/generos/sertanejo.png" alt="Sertanejo" class="circle-img">
          </a>
          <div class="genre-label-box">Sertanejo</div>
        </div>

        <div class="card-item">
          <a href="Genero14.html" class="circle-link">
            <img src="Imagens/generos/rock.png" alt="Rock" class="circle-img">
          </a>
          <div class="genre-label-box">Rock</div>
        </div>

        <div class="card-item">
          <a href="Genero14.html" class="circle-link">
            <img src="Imagens/generos/mpb.jpg" alt="MPB" class="circle-img">
          </a>
          <div class="genre-label-box">MPB</div>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
