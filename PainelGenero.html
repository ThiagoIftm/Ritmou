<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RITMOU - Painel Gênero Musical</title>
    <link rel="stylesheet" href="style.css">
    
    <style>

  /* ==================== CONTEÚDO PRINCIPAL ==================== */
      .main-content {
        position: fixed;
        top: 180px;
        bottom: 0;
        left: 200px;
        right: 250px;
        overflow-y: auto;
        padding: 8px 30px 0 30px; 
        display: flex;
        flex-direction: column;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .main-content::-webkit-scrollbar {
        display: none;
      }

      .playlist-hero {
        position: relative;
        z-index: 2;
        background-color: #243b8b;
        border-radius: 24px 24px 0 24px;
        padding: 0 23px 0 0;
        display: flex;
        align-items: center;
        gap: 23px;
        box-shadow: 3px 5px 11px rgba(0, 0, 0, 0.3);
        color: #ffffff;
        height: 150px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .playlist-hero-cover {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 15px 15px 15px 15px;
        flex-shrink: 0;
      }

      .playlist-hero-info {
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding: 15px 0;
      }

      .playlist-label {
        font-size: 14px;
        font-weight: 600;
        color: #a5b4fc;
      }

      .playlist-title {
        font-size: 35px;
        font-weight: 800;
        line-height: 1;
      }

      .playlist-actions {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 4px;
      }

      .play-hero-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background-color: #4a8bf5;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 2px 3px 8px rgba(0, 0, 0, 0.3);
        transition: transform 0.2s;
      }

      .play-hero-btn:hover {
        transform: scale(1.08);
      }

      .play-hero-icon {
        width: 17px;
        height: 17px;
        fill: #ffffff;
        margin-left: 2px;
      }

      .action-icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        color: #ffffff;
      }

      .shuffle-icon {
        width: 21px;
        height: 21px;
        fill: #ffffff;
        opacity: 0.85;
        transition: opacity 0.2s;
      }

      .shuffle-icon:hover {
        opacity: 1;
      }

      .delete-playlist-btn {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        opacity: 0.9;
        transition: opacity 0.2s;
      }

      .delete-playlist-btn:hover {
        opacity: 1;
      }

      .minus-circle-icon {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: bold;
        line-height: 1;
      }

      .tracklist-container {
        position: relative;
        z-index: 1;
        background-color: #223555;
        border-radius: 15px 15px 0 0;
        margin-top: -75px;
        padding: 90px 23px 45px 23px;
        box-shadow: 3px 5px 11px rgba(0, 0, 0, 0.3);
        color: #ffffff;
        flex-grow: 1;
        flex-shrink: 0;
        min-height: calc(100% - 75px);
      }

      .track-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .track-table th {
        padding: 9px 11px;
        font-size: 14px;
        font-weight: 700;
        border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        color: #ffffff;
      }

      .track-table td {
        padding: 11px 11px;
        font-size: 12px;
        vertical-align: middle;
      }

      .track-row {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        transition: background-color 0.2s;
        cursor: pointer;
      }

      .track-row:hover {
        background-color: rgba(255, 255, 255, 0.08);
      }

      .track-index {
        font-weight: 700;
        font-size: 14px;
        width: 30px;
      }

      .track-title-cell {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      .track-thumb {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        object-fit: cover;
        flex-shrink: 0;
      }

      .track-details {
        display: flex;
        flex-direction: column;
      }

      .track-name {
        font-weight: 700;
        font-size: 12px;
        color: #ffffff;
        text-decoration: none;
      }

      .track-name:hover {
        text-decoration: underline;
      }

      .track-artist {
        font-size: 10px;
        color: #cbd5e1;
        text-decoration: none;
      }

      .track-artist:hover {
        text-decoration: underline;
        color: #ffffff;
      }

      .track-time {
        font-weight: 600;
        color: #ffffff;
        width: 60px;
      }

      .track-album {
        font-weight: 600;
        color: #ffffff;
      }

      .album-link {
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }

      .album-link:hover {
        text-decoration: underline;
      }

      .clock-icon {
        width: 15px;
        height: 15px;
        fill: #ffffff;
        vertical-align: middle;
      }

    </style>
  </head>
  <body>

    <!-- CABEÇALHO -->
    <header class="header">
      <div class="header-left">
        <div class="logo-circle-wrapper">
          <img src="Imagens/LogoRitmou.png" alt="Logo RITMOU" class="logo-img">
        </div>
      </div>

      <div class="header-center">
        <div class="search-row">
          <a href="Inicio.html" class="home-btn" title="Início">
            <svg class="home-icon" viewBox="0 0 24 24">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
          </a>

          <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" class="search-input" placeholder="O que deseja ouvir?">
          </div>
        </div>

        <div class="nav-buttons">
          <a href="Musicas.html">
            <button class="nav-btn">MÚSICAS</button>
          </a>
          <a href="Biblioteca.html">
            <button class="nav-btn">PLAYLISTS</button>
          </a>        
        </div>
      </div>

      <div class="header-right">
        <a href="VisaoConta.html" class="profile-link" title="Perfil do Usuário">
          <img src="Imagens/user_icon.png" alt="Foto Perfil" class="profile-img">
        </a>
      </div>
    </header>

  <!-- MENU LATERAL ESQUERDO -->
  <aside class="sidebar-left expanded" id="sidebarLeft">

    <div class="sidebar-header-row" style="display: flex; align-items: center; justify-content: space-between; padding-right: 15px; margin-bottom: 15px;">
      
      <button class="sidebar-toggle-btn"> 
        <span class="sidebar-title-text">Sua Biblioteca</span>
      </button>

      <a href="CriarPlaylist.html" title="Criar Nova Playlist" class="add-playlist-link">
        <button class="add-playlist-btn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </button>
      </a>
      
    </div>

    <div class="playlist-list">
      <a href="Playlist.html?id=pl0" class="playlist-item">
        <img src="Imagens/artistas/59.png" alt="Playlist 1" class="playlist-thumb">
        <span class="playlist-name">As Mais Tocadas</span>
      </a>
      <a href="Playlist.html?id=pl1" class="playlist-item">
        <img src="Imagens/artistas/38.png" alt="Playlist 2" class="playlist-thumb">
        <span class="playlist-name">Churrasqueada</span>
      </a>
      <a href="Playlist.html?id=pl2" class="playlist-item">
        <img src="Imagens/artistas/60.png" alt="Playlist 3" class="playlist-thumb">
        <span class="playlist-name">Treino Intenso</span>
      </a>
      <a href="Playlist.html?id=pl3" class="playlist-item">
        <img src="Imagens/artistas/56.png" alt="Playlist 4" class="playlist-thumb">
        <span class="playlist-name">Relax</span>
      </a>
    </div>
  </aside>

<!-- ÁREA CENTRAL DA PÁGINA -->
    <main class="main-content" id="mainContent">

      <section class="playlist-hero">
          <img src="" alt="Capa Gênero" class="playlist-hero-cover" id="capa-genero-img">
          
          <div class="playlist-hero-info">
            <span class="playlist-label">Gênero</span>
            <h1 class="playlist-title" id="nome-genero-texto"></h1>
            
            <div class="playlist-actions">
              <button class="play-hero-btn" id="play-genero-btn" title="Tocar Playlist">
                <svg class="play-hero-icon" viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z"/>
                </svg>
              </button>
              
              <button class="action-icon-btn" id="shuffle-genero-btn" title="Ordem Aleatória">
                <svg class="shuffle-icon" id="shuffle-icon" viewBox="0 0 24 24" style="fill: #ffffff; transition: fill 0.2s;">
                  <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                </svg>
              </button>
              
            </div>
        </div>
      </section>

      <section class="tracklist-container">
        <table class="track-table">
          <thead>
            <tr>
              <th style="width: 50px;">#</th>
              <th>Título</th>
              <th style="width: 100px;">
                <svg class="clock-icon" viewBox="0 0 24 24">
                  <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                </svg>
              </th>
              <th>Álbum</th>
            </tr>
          </thead>
          
          <tbody id="tracklist-genero-body">
            

          </tbody>
        </table>
      </section>

    </main>





    <!-- ÁREA DE MÚSICA DIREITA -->
    <aside class="sidebar-right expanded" id="sidebarRight" onclick="handleRightSidebarClick(event)">
      <div class="music-collapsed-view">
        <div class="music-collapsed-btn">&lt;</div>
      </div>

      
      <div class="sidebar-right-header"> 
        <h2 class="sidebar-right-title">Discoteca</h2>
      </div>

      <div class="music-cover-container">
        <a href="#" id="menu-link-capa">
          <img src="" alt="Capa da Música" class="music-cover" id="menu-img-capa">
        </a>
      </div>

      <div class="minimal-player-container">
        <div class="player-progress">
          <input type="range" id="minimal-progress" min="0" max="100" value="0">
        </div>

        <div class="player-controls-bottom">
          <button class="control-btn prev-btn">
            <svg viewBox="0 0 24 24" class="icon-skip"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="control-btn play-pause-btn">
            <svg viewBox="0 0 24 24" class="icon-pause"><path d="M8 19h3V5H8v14zm5-14v14h3V5h-3z"/></svg>
          </button>
          <button class="control-btn next-btn">
            <svg viewBox="0 0 24 24" class="icon-skip"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
      </div>

      <div class="music-info-row">
        <div class="music-text">
          <a href="#" id="menu-link-musica" style="text-decoration: none; color: inherit;">
            <h3 class="music-name" id="menu-nome-musica">Carregando...</h3>
          </a>
          <a href="#" id="menu-link-artista-sub">
            <p class="artist-name-sub" id="menu-nome-artista-sub">Carregando...</p>
          </a>
        </div>
      </div>



      </div>
    </aside>



    <div class="universal-music-bar">
        <div class="umb-info">
            <img id="umb-capa" src="" alt="Capa da música" style="display: none;">
            <div class="umb-text">
                <a href="#" id="umb-nome-musica"></a>
                <a href="#" id="umb-nome-artista"></a>
            </div>
        </div>

        <div class="umb-controls">
            <div class="umb-buttons">
                <button class="prev-btn" id="umb-btn-prev">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="play-pause-btn" id="umb-btn-play">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="next-btn" id="umb-btn-next">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="umb-progress">
                <span id="umb-tempo-atual">0:00</span>
                <input type="range" id="minimal-progress" min="0" max="100" value="0">
                <span id="umb-tempo-total">0:00</span>
            </div>
        </div>

        <div class="umb-volume">
            <button id="umb-btn-mute">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <input type="range" id="umb-volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <script>

    document.addEventListener('DOMContentLoaded', () => {
      const sidebarLeft = document.getElementById('sidebarLeft');
      const sidebarRight = document.getElementById('sidebarRight');
      const toggleIconLeft = document.getElementById('toggleIconLeft');

      sidebarLeft.classList.add('expanded');
      sidebarRight.classList.add('expanded');

      if (toggleIconLeft) {
        toggleIconLeft.textContent = '<';
      }
    });


      function toggleSidebarLeft() {
        const sidebarLeft = document.getElementById('sidebarLeft');
        const toggleIcon = document.getElementById('toggleIconLeft');

        sidebarLeft.classList.toggle('expanded');

        if (sidebarLeft.classList.contains('expanded')) {
          toggleIcon.textContent = '<';
        } else {
          toggleIcon.textContent = '>';
        }
      }

      function handleRightSidebarClick(event) {
        const sidebarRight = document.getElementById('sidebarRight');

        if (!sidebarRight.classList.contains('expanded')) {
          sidebarRight.classList.add('expanded');
        }
      }

      function collapseSidebarRight(event) {
        event.stopPropagation();
        const sidebarRight = document.getElementById('sidebarRight');

        sidebarRight.classList.remove('expanded');
      }
    </script>

    <audio id="audio-player" src=""></audio>

    <script src="ScriptGenero.js"></script>
    <script src="ScriptMusicaGlobal.js"></script>

  </body>
</html>
