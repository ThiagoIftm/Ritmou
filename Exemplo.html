<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RITMOU - Cadastrar</title>
  <style>
    /* RESET DE ESTILOS BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      background-color: #243b8b;
    }

    .container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* ==================== PAINEL ESQUERDO (LOGO SEM TEXTO) ==================== */
    .left-panel {
      flex: 1;
      background-color: #f4f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .main-logo-img {
      max-width: 320px;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* ==================== PAINEL DIREITO (FORMULÁRIO) ==================== */
    .right-panel {
      flex: 1.3;
      background-color: #243b8b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      color: #ffffff;
    }

    /* CABEÇALHO DO FORMULÁRIO COM LOGO MAIOR */
    .form-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      text-align: center;
    }

    .mini-logo-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #4a8bf5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.35);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .mini-logo-img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
    }

    .welcome-subtitle {
      font-size: 15px;
      font-weight: 600;
      color: #d1d5db;
      margin-top: 2px;
    }

    /* GRID DO FORMULÁRIO COM ESPAÇAMENTO E CAMPOS MAIORES */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 40px;
      row-gap: 24px;
      width: 100%;
      max-width: 720px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input,
    .form-select {
      width: 100%;
      height: 52px;
      background-color: #4a8bf5;
      border: none;
      border-radius: 26px;
      padding: 0 24px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.2s ease;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .form-input:focus,
    .form-select:focus {
      background-color: #3b7be3;
    }

    /* SELECT ESTILIZADO */
    .form-select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      cursor: pointer;
      padding-right: 45px;
    }

    .form-select option {
      background-color: #243b8b;
      color: #ffffff;
      font-size: 15px;
      padding: 12px;
    }

    .select-arrow {
      position: absolute;
      right: 20px;
      pointer-events: none;
      width: 14px;
      height: 14px;
      fill: #ffffff;
    }

    /* ÍCONES INTERNOS (SENHA E DATA) */
    .input-icon-btn {
      position: absolute;
      right: 18px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .input-icon {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      opacity: 0.95;
    }

    /* OMITIR O ÍCONE NATIVO DUPLICADO DO SELETOR DE DATA */
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0;
      position: absolute;
      right: 0;
      top: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    input[type="date"]::-webkit-inner-spin-button,
    input[type="date"]::-webkit-clear-button {
      display: none;
    }

    .date-icons {
      position: absolute;
      right: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    /* BOTÃO INSCREVER-SE */
    .submit-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 35px;
      width: 100%;
    }

    .btn-submit {
      background-color: #4a8bf5;
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      padding: 12px 42px;
      border-radius: 24px;
      border: none;
      cursor: pointer;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background-color: #3b7be3;
      transform: scale(1.02);
    }

    /* RODAPÉ DO FORMULÁRIO */
    .footer-text {
      margin-top: 18px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .login-link {
      color: #10b981;
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }

    .login-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- PAINEL ESQUERDO DA LOGO -->
    <main class="left-panel">
      <img src="COLOQUE_SEU_ENDERECO_AQUI.png" alt="Logo RITMOU" class="main-logo-img">
    </main>

    <!-- PAINEL DIREITO DO FORMULÁRIO -->
    <aside class="right-panel">
      
      <div class="form-header">
        <div class="mini-logo-circle">
          <img src="COLOQUE_SEU_ENDERECO_AQUI.png" alt="Mini Logo" class="mini-logo-img">
        </div>
        <h2 class="welcome-title">Bem Vindo!</h2>
        <p class="welcome-subtitle">Crie sua conta</p>
      </div>

      <form id="cadastrarForm" class="form-grid">
        
        <!-- EMAIL -->
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrapper">
            <input type="email" class="form-input" placeholder="Digite seu email aqui" required>
          </div>
        </div>

        <!-- NICKNAME -->
        <div class="form-group">
          <label class="form-label">Nickname</label>
          <div class="input-wrapper">
            <input type="text" class="form-input" placeholder="Digite seu nickname aqui" required>
          </div>
        </div>

        <!-- NOME COMPLETO -->
        <div class="form-group">
          <label class="form-label">Nome completo</label>
          <div class="input-wrapper">
            <input type="text" class="form-input" placeholder="Digite seu nome completo aqui" required>
          </div>
        </div>

        <!-- TELEFONE -->
        <div class="form-group">
          <label class="form-label">Telefone</label>
          <div class="input-wrapper">
            <input type="tel" id="telefoneInput" class="form-input" placeholder="(xx) xxxxx-xxxx" maxlength="15" required>
          </div>
        </div>

        <!-- CPF -->
        <div class="form-group">
          <label class="form-label">CPF</label>
          <div class="input-wrapper">
            <input type="text" id="cpfInput" class="form-input" placeholder="Digite apenas os 11 números" maxlength="11" required>
          </div>
        </div>

        <!-- SEXO -->
        <div class="form-group">
          <label class="form-label">Sexo</label>
          <div class="input-wrapper">
            <select class="form-select" required>
              <option value="" disabled selected hidden>Informe seu sexo</option>
              <option value="M">Masculino</option>
              <option value="F">Feminino</option>
              <option value="O">Outro</option>
              <option value="N">Prefiro não informar</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24">
              <path d="M7 10l5 5 5-5z"/>
            </svg>
          </div>
        </div>

        <!-- SENHA -->
        <div class="form-group">
          <label class="form-label">Senha</label>
          <div class="input-wrapper">
            <input type="password" id="senhaInput" class="form-input" placeholder="Digite sua senha aqui" required>
            <button type="button" class="input-icon-btn" onclick="toggleSenha()" title="Mostrar/Ocultar Senha">
              <svg class="input-icon" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- DATA DE NASCIMENTO -->
        <div class="form-group">
          <label class="form-label">Data de Nascimento</label>
          <div class="input-wrapper">
            <input type="date" class="form-input" required>
            <div class="date-icons">
              <svg class="input-icon" viewBox="0 0 24 24">
                <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
              </svg>
              <svg class="select-arrow" viewBox="0 0 24 24" style="position: static;">
                <path d="M7 10l5 5 5-5z"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="submit-container" style="grid-column: span 2;">
          <button type="submit" class="btn-submit">Inscrever - se</button>
          <p class="footer-text">Já possui uma conta? <a href="Entrar3.html" class="login-link">Entre</a></p>
        </div>

      </form>

    </aside>
  </div>

  <script>
    // Alterna a visibilidade da senha
    function toggleSenha() {
      const senhaInput = document.getElementById('senhaInput');
      senhaInput.type = (senhaInput.type === 'password') ? 'text' : 'password';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const telInput = document.getElementById('telefoneInput');
      const cpfInput = document.getElementById('cpfInput');
      const senhaInput = document.getElementById('senhaInput');

      // Máscara automática de Telefone no formato (xx) xxxxx-xxxx
      telInput.addEventListener('input', (e) => {
        let v = e.target.value.replace(/\D/g, '').slice(0, 11);
        if (v.length > 7) {
          v = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
        } else if (v.length > 2) {
          v = `(${v.slice(0, 2)}) ${v.slice(2)}`;
        } else if (v.length > 0) {
          v = `(${v}`;
        }
        e.target.value = v;
      });

      // CPF: Apenas números e limite de 11 caracteres
      cpfInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11);
      });

      // Senha: Não aceita espaços
      senhaInput.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\s/g, '');
      });

      // Validações ao enviar formulário
      document.getElementById('cadastrarForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Validação de Telefone no formato (xx) xxxxx-xxxx
        const telRegex = /^\(\d{2}\) \d{5}-\d{4}$/;
        if (!telRegex.test(telInput.value)) {
          alert('Por favor, digite o telefone no formato correto: (xx) xxxxx-xxxx');
          telInput.focus();
          return;
        }

        // Validação de CPF (exatamente 11 números)
        if (cpfInput.value.length !== 11) {
          alert('O CPF deve conter exatamente 11 números.');
          cpfInput.focus();
          return;
        }

        alert('Cadastro realizado com sucesso');
        window.location.href = 'UsuárioLogado4.html';
      });
    });
  </script>

</body>
</html>
