<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RITMOU - Finalizar Assinatura</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e293b 0%, #243b8b 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .checkout-wrapper {
      max-width: 1000px;
      width: 100%;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }

    .header-logo {
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
    }

    .header-logo img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .checkout-box {
      background-color: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .payment-section {
      flex: 2;
      min-width: 320px;
    }

    .summary-section {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 25px;
      color: #f8fafc;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .payment-methods {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    .method-btn {
      flex: 1;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #cbd5e1;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      text-align: center;
    }

    .method-btn.active {
      background-color: #4a8bf5;
      color: #ffffff;
      border-color: #4a8bf5;
      box-shadow: 0 4px 12px rgba(74, 139, 245, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .form-input:focus {
      border-color: #4a8bf5;
      background-color: rgba(0, 0, 0, 0.3);
    }

    .pix-content {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .pix-qr {
      width: 180px;
      height: 180px;
      background-color: #ffffff;
      border-radius: 12px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
    }

    .pix-code {
      background-color: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      color: #94a3b8;
      word-break: break-all;
      margin-bottom: 15px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 15px;
      color: #cbd5e1;
    }

    .summary-item.total {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 15px;
      margin-top: auto;
    }

    .selected-plan-box {
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), rgba(36, 59, 139, 0.5));
      border: 1px solid #4a8bf5;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .selected-plan-title {
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .btn-checkout {
      width: 100%;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      color: #ffffff;
      padding: 16px;
      border-radius: 30px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      margin-top: 20px;
    }

    .btn-checkout:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }
    
    .back-link {
      display: block;
      text-align: center;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      margin-top: 20px;
      transition: color 0.2s;
    }
    
    .back-link:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="checkout-wrapper">
    
    <div class="checkout-box payment-section">
      <h2 class="section-title">Método de Pagamento</h2>
      
      <div class="payment-methods">
        <div class="method-btn active" id="btn-card" onclick="mudarMetodo('card')">Cartão de Crédito</div>
        <div class="method-btn" id="btn-pix" onclick="mudarMetodo('pix')">PIX</div>
      </div>

      <form id="form-card" onsubmit="processarPagamento(event)">
        <div class="form-group">
          <label class="form-label">Nome no Cartão</label>
          <input type="text" class="form-input" placeholder="JOSE DOS SANTOS" required>
        </div>
        
        <div class="form-group">
          <label class="form-label">Número do Cartão</label>
          <input type="text" class="form-input" placeholder="0000 0000 0000 0000" maxlength="19" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Validade (MM/AA)</label>
            <input type="text" class="form-input" placeholder="12/29" maxlength="5" required>
          </div>
          <div class="form-group">
            <label class="form-label">CVV</label>
            <input type="text" class="form-input" placeholder="123" maxlength="4" required>
          </div>
        </div>
        
        <button type="submit" class="btn-checkout">Confirmar Pagamento</button>
      </form>

      <div id="content-pix" class="pix-content">
        <p style="margin-bottom: 15px; color: #cbd5e1;">Escaneie o código QR abaixo através da aplicação do seu banco:</p>
        <div class="pix-qr">
          [ QR CODE PIX ]
        </div>
        <div class="pix-code">
          00020126360014BR.GOV.BCB.PIX...
        </div>
        <button class="btn-checkout" style="background: transparent; border: 1px solid #4a8bf5; margin-top: 0; box-shadow: none;" onclick="copiarPix()">Copiar Código PIX</button>
        <button class="btn-checkout" onclick="simularAprovacaoPix()">Já efetuei o pagamento</button>
      </div>
    </div>

    <div class="checkout-box summary-section">
      <h2 class="section-title">Resumo do Pedido</h2>
      
      <div class="selected-plan-box">
        <div class="selected-plan-title">Plano Premium</div>
        <div style="font-size: 13px; color: #93c5fd;">Assinatura Mensal</div>
      </div>

      <div class="summary-item">
        <span>Subtotal</span>
        <span>R$ 24,97</span>
      </div>
      <div class="summary-item">
        <span>Taxas</span>
        <span>R$ 0,00</span>
      </div>
      
      <div class="summary-item total">
        <span>Total</span>
        <span>R$ 24,97</span>
      </div>

      <a href="Planos.html" class="back-link">← Voltar aos Planos</a>
    </div>

  </div>


  <script>
    function mudarMetodo(metodo) {
      const btnCard = document.getElementById('btn-card');
      const btnPix = document.getElementById('btn-pix');
      const formCard = document.getElementById('form-card');
      const contentPix = document.getElementById('content-pix');

      if (metodo === 'card') {
        btnCard.classList.add('active');
        btnPix.classList.remove('active');
        formCard.style.display = 'block';
        contentPix.style.display = 'none';
      } else {
        btnPix.classList.add('active');
        btnCard.classList.remove('active');
        contentPix.style.display = 'block';
        formCard.style.display = 'none';
      }
    }

    function processarPagamento(event) {
      event.preventDefault();
      alert("Pagamento processado com sucesso! Bem-vindo ao Plano Premium.");
      window.location.href = "Inicio.html";
    }

    // Função para simular confirmação do PIX
    function simularAprovacaoPix() {
      alert("Estamos a confirmar o seu PIX... Pagamento aprovado!");
      window.location.href = "Inicio.html";
    }

    function copiarPix() {
      alert("Código PIX copiado para a área de transferência!");
    }
  </script>

</body>
</html>
